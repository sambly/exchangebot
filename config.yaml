app:
    server-name: exchange-bot
    # exchange or grpc    
    exchange-type: exchange
    pairs-from-file: true
    pprof-enable: false
web:
    use-tls: false
    listen-port: "80"
    host: ""
    content-embed: true
    username-auth: ""
    password-auth: ""
exchange:
    api-key: ""
    secret-key: ""
tlg:
    token: ""
    user: ""
    notification-enable: false
    enable: false
    use-proxy: false
    proxy-url: ""
    # use-custom-api: false - обращаться к api.telegram.org напрямую (по умолчанию).
    # true - обращаться к custom-api-url вместо api.telegram.org (неофициальная
    # прокладка, которая сама уже общается с Telegram).
    use-custom-api: false
    custom-api-url: ""
    # webhook-enable: false - long-polling (по умолчанию); true - webhook.
    # webhook-url - публичный домен (например https://example.com), без пути.
    # webhook-path - путь, на который reverse-proxy проксирует запросы Telegram
    # на веб-сервер приложения, например /telegram/webhook/<random>.
    webhook-enable: false
    webhook-url: ""
    webhook-path: ""
    webhook-secret: ""
db:
    type: mysql
    name: datafeeder
    password: q1w2e3
    host: ""
    host-local: 127.0.0.1
    host-docker: mysql
    port: 3306
    user: root
grpc:
    host: 0.0.0.0
    host-local: 0.0.0.0
    host-docker: exchange_service
    port: 50051
log:
    debug: true
    production: false
notification:
    enable: false
tracer:
    enable-open-telemetry: false
    otel-exporter-otlp-endpoint: ""
    otel-service-name: ""
depth:
    # По каким парам держать L2-стакан (internal/depth.AssetsDepth). Пусто по
    # умолчанию - фича готова, но выключена: подписка на глубину заметно
    # тяжелее тикеров, включать сразу на все пары не стоит без явного решения.
    all-pairs: false
    pairs: []
