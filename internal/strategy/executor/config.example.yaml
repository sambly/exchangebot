# Имя стратегии
name: Executor
# Id стратегии
idName: executor
# Описание стратегии
description: Исполнитель сделок. Принимает сигналы от детекторов и открывает позиции
# Включение стратегии
strategyEnable: true

# АВТОМАТИЧЕСКИЙ ВХОД без подтверждения в Telegram.
# false - по сигналу приходит кнопка "Купить", решение за человеком.
# true  - позиция открывается сама, по фильтрам и риск-лимитам ниже.
#
# Исполнение бумажное (paperwallet), реальных ордеров на бирже нет, поэтому
# авторежим - это честный форвард-тест, а не торговля деньгами.
auto: false

# От каких детекторов принимаем сигналы. Пусто - от всех.
sources:
  - anomaly

# ЧТО ДЕЛАТЬ с сигналом каждого направления: buy, sell или skip.
#
# Направление сигнала и сторона сделки - РАЗНЫЕ вещи. Раньше сторона всегда была
# BUY, и на аномальное падение на 10% приходило предложение купить, то есть
# поймать падающий нож.
#
#   onUp: buy    - цена аномально выросла, играем на продолжение (лонг)
#   onUp: sell   - выросла, играем на откат (шорт против импульса)
#   onDown: sell - упала, играем на продолжение падения (шорт)
#   onDown: buy  - упала, играем на отскок (лонг; тот самый нож, стоп обязателен)
#   skip         - сигналы этого направления не торгуем
#
# Внимание: исполнение бумажное, поэтому "продажа" здесь - это шорт в модели
# paperwallet, а не реальная продажа спота.
#
# Это глобальный дефолт - на периоды, для которых ниже (periods) нет
# переопределения.
onUp: buy
onDown: sell

# Переопределение onUp/onDown по сигнальному периоду: пусто в конкретном поле -
# берётся глобальное значение выше. Полезно, потому что momentum и
# mean-reversion на разных периодах ведут себя по-разному - см. periods в
# config.yaml и комментарий там для конкретных цифр бэктеста.
#
# ВАЖНО: это переопределение имеет смысл ТОЛЬКО для источников, у которых
# Direction означает "куда пошла цена" (anomaly, base). У potential/levels
# Direction - это уже готовая рекомендация стороны (композит/структура сами
# решили BUY или SELL) - для них period-зависимый fade означал бы буквально
# торговать против собственной рекомендации. Такие источники нужно перечислить
# в sourceDirections ниже - она проверяется раньше и полностью обходит periods.
periods: {}

# Оверрайд onUp/onDown ПО ИСТОЧНИКУ СИГНАЛА - проверяется раньше periods выше и,
# если для источника есть запись, полностью её обходит (см. предупреждение
# там же). Для potential/levels обычно нужен именно buy/sell без какой-либо
# инверсии - их Direction уже сама решает сторону.
sourceDirections: {}
# sourceDirections:
#   potential:
#     onUp: buy
#     onDown: sell
#   levels:
#     onUp: buy
#     onDown: sell

# Не входить в сигналы Divergent=true: движение цены при активности НИЖЕ
# обычной ("пустой стакан"), такие движения чаще откатываются. На бэктесте
# эффект разнонаправленный по периодам и не всегда статистически надёжный
# (мало сделок) - проверить на своих данных перед включением.
skipDivergent: false

# ФИЛЬТРЫ ПО РЫНОЧНОМУ КОНТЕКСТУ (см. Executor.marketFiltersAllow) - в
# отличие от остальных полей выше, требуют AssetsSetup (подключается в
# strategy.go, WithAssetsSetup) и работают ТОЛЬКО в бою: backtest.Engine их не
# применяет (использует только Config.SideFor, см. Go-комментарий в
# executor/config.go).
#
# requireLevelsAgree - сторона сделки должна совпадать с рекомендацией
# свечных swing-уровней (entrysetup.GetPriceLevels + LevelsSideScore). Нет
# уровней или они не дают чёткой стороны - НЕ блокирует (нечем подтвердить не
# значит "противоречит"). Действует на ВСЕ sources сразу, не per-source.
requireLevelsAgree: false

# maxVolatilityRegime - верхняя граница entrysetup.GetVolatilityRegime
# (отношение НЕДАВНЕЙ волатильности пары к ТИПИЧНОЙ, >1 - пара уже разогналась
# сильнее обычного ПРЯМО СЕЙЧАС). 0 - фильтр выключен. Нет данных (мало
# истории) - НЕ блокирует, отсекает только подтверждённо разогнавшиеся пары,
# а не "неизвестные". Пример из практики - см. ARCHITECTURE.md §10.14/10.15:
# одна экстремально волатильная тонкая пара может дать источнику сигналов
# больше половины всего его убытка.
maxVolatilityRegime: 0

# maxTrendStrengthBySource - верхняя граница entrysetup.GetTrendStrength
# (0..1, efficiency ratio: 1 - цена прошла путь по прямой, сильный тренд;
# 0 - зигзаг без чистого сдвига, боковик) ПО ИСТОЧНИКУ. ДРУГАЯ ось, чем
# maxVolatilityRegime выше (та - амплитуда движения, эта - направленность) -
# пара может быть одновременно волатильной и боковой. Источник БЕЗ записи -
# фильтр для него не применяется вовсе. Нет данных - НЕ блокирует.
#
# Задуман для mean-reversion детекторов (potential, levels) - см.
# ARCHITECTURE.md §10.16: реальный бэктест на BTC показал profit factor 1.62
# в боковике против -0.74 в тренде на ОДНОЙ И ТОЙ ЖЕ логике входа. НЕ стоит
# добавлять сюда anomaly бездумно - на 4h у неё momentum-конфигурация (см.
# periods выше), сильный тренд ей скорее помогает.
maxTrendStrengthBySource: {}
# maxTrendStrengthBySource:
#   potential: 0.35
#   levels: 0.35

# Минимальная сила сигнала для входа. У anomaly это уровень: 1 (⚠️), 2 (🔴), 3 (🚨).
# На уровне 1 сигналов слишком много, чтобы торговать их автоматом.
minLevel: 2

# Размер сделки
size: 1.0

# РИСК-ЛИМИТЫ. Без них авторежим на одном движении рынка откроет десятки позиций.
#
# Сколько позиций держим одновременно НА КАЖДЫЙ источник сигнала (sources)
# НЕЗАВИСИМО, а не общий потолок сразу на всех: у anomaly свой бюджет в
# maxPositions позиций, у potential - свой такой же, один источник не может
# выесть лимит у другого. На рыночном движении аномальными становятся десятки
# пар разом, и войти во все - это не диверсификация, а плечо.
maxPositions: 5

# Сколько ждать после закрытия позиции по паре, прежде чем открывать новую.
# Anomaly на одном движении срабатывает каждую минуту (плюс эскалация уровней),
# поэтому без cooldown мы бы набирали "лестницу" по одной паре по всё более
# высокой цене. Одна позиция на пару соблюдается всегда, независимо от этого.
pairCooldownMinutes: 60
