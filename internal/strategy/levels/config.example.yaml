# Имя стратегии
name: Levels
# Id стратегии
idName: levels
# Описание стратегии
description: Вход у свечных уровней поддержки/сопротивления (swing high/low) - структурный, не статистический сигнал

# Включение стратегии. false по умолчанию - стратегия совсем новая, не
# проверенная на реальной торговле, включать сознательно.
#
# Само по себе включение НЕ начинает торговать: исполнитель (executor)
# принимает сигналы только от источников, перечисленных в его sources
# (internal/strategy/executor/config.yaml) - туда "levels" нужно добавить
# отдельно, руками, когда решите, что готовы дать ему реально открывать
# позиции в paperwallet. См. также internal/strategy/sales/structsale/
# config.yaml, секция sources - естественно завести там оверрайд
# useStructuralPriceLevels: true для этого источника (выход по тем же
# уровням, что и вход), отдельно от anomaly/potential.
strategyEnable: false

# Проверить все пары
allPairs: true
# Выбор определённых пар (если allPairs: false)
pairs:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - DOGEUSDT
  - PEPEUSDT

# Минимальный суточный оборот пары в USDT - тот же фильтр неликвида, что у
# anomaly/potential (см. комментарий там): на мёртвой паре swing high/low
# легко находятся там, где никто не торговал, а не там, где реально
# разворачивалась цена.
minDailyVolume: 5000000

# Какие периоды проверять. entrysetup.GetAllPriceLevels считает их все
# автоматически (глобальный settings.ChangePeriods), здесь - подмножество,
# которое реально хотим торговать.
periods:
  - 15m

# Пороги Score (= дальний уровень / ближний, entrysetup.LevelsSideScore) для
# уровня 1..3. Ниже level1 - сигнала нет вообще: уровни есть, но расположены
# слишком близко друг к другу, тесная цель / узкий стоп - не лучше, чем
# волатильностная оценка, а хуже.
#
# НЕ откалиброваны бэктестом - у detector.backtest.Detector этой стратегии
# пока нет (нужен для cmd backtest), это отправная точка, требующая проверки
# на реальной работе в paperwallet.
thresholds:
  level1: 1.5
  level2: 2.5
  level3: 4.0

# Сколько тиков (AssetsPrices.Subscribe(), примерно раз в минуту) сторона
# должна продержаться подряд, прежде чем стать сигналом - защита от того, что
# кэш GetAllPriceLevels (30с TTL) обновился и уровень на границе порога на
# мгновение изменился. Тот же принцип, что у anomaly.ConfirmChecks.
confirmChecks: 2

# Cooldown на пару+период после публикации сигнала (минуты). Одну позицию на
# пару и так не даст открыть исполнитель (Executor.riskAllows) - это защита
# от повторной публикации в лог/подписчикам, пока цена держится у уровня.
cooldownMinutes: 15

# Писать каждый опубликованный сигнал в лог. Единственный канал наблюдения за
# стратегией сейчас (нет Telegram-меню/дайджеста) - по умолчанию включено.
logSignals: true
