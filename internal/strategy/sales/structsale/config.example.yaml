# Имя стратегии
name: SaleStruct
# Id стратегии
idName: salestruct
# Описание стратегии
description: Политика выхода - тейк/стоп от волатильности + трейлинг-стоп + масштабирование по силе сигнала
# Включение стратегии
strategyEnable: true

# ПОРОГИ В ЕДИНИЦАХ ВОЛАТИЛЬНОСТИ ПАРЫ - см. simplesale, та же математика.
takeProfitVol: 2.0
stopLossVol: 1.5

# Откат в процентах - для сигналов, которые волатильность не считают (base).
takeProfitPercent: 2.0
stopLossPercent: 1.5

# Границы для посчитанных порогов.
minTakeProfitPercent: 0.5
maxTakeProfitPercent: 20.0
minStopLossPercent: 0.5
maxStopLossPercent: 10.0

# Сколько ПЕРИОДОВ СИГНАЛА держим позицию, если не сработали ни тейк, ни стоп,
# ни трейлинг. 0 - без ограничения по времени (не рекомендуется).
maxHoldPeriods: 4

# НА СКОЛЬКО УВЕЛИЧИВАТЬ ТЕЙК (не стоп) за каждый уровень силы сигнала выше 1
# (anomaly Level 1..3): level=2 -> x1.15, level=3 -> x1.30 при значении 0.15.
# 0 - масштабирование выключено.
strengthScalePerLevel: 0.15

# ТРЕЙЛИНГ-СТОП.
#
# trailingActivationPercent - прибыль (%), после которой стоп перестаёт быть
# фиксированным и начинает следовать за лучшей ценой с момента входа. До этого
# порога позиция ведёт себя как в simplesale. 0 - трейлинг выключен вовсе.
trailingActivationPercent: 1.0

# trailingCallbackPercent - сколько процентных пунктов прибыли можно отдать от
# лучшего значения (не от входа), прежде чем трейлинг закроет позицию.
trailingCallbackPercent: 0.6

# СТРУКТУРНЫЙ СТОП/ТЕЙК ОТ СТЕН СТАКАНА (entrysetup.GetQuality).
#
# Работает ТОЛЬКО в бою - у стакана нет истории для бэктеста, в backtest.go
# эта фича не сработает физически (entrySetup=nil), даже если тут true.
#
# useStructuralLevels: true - если на момент сигнала у пары найдены обе стены
# (см. entrysetup.Walls) с достаточным соотношением (minStructuralScore),
# план полностью берётся оттуда: стоп = дистанция до ближней стены, тейк = до
# дальней, вместо оценки по волатильности.
useStructuralLevels: true

# minStructuralScore - минимальное соотношение дальней стены к ближней, при
# котором структурный план вообще используется. Ниже - стены слишком близко
# друг к другу, волатильностная оценка честнее.
minStructuralScore: 1.5

# ЧАСТИЧНЫЙ ТЕЙК-ПРОФИТ.
#
# РАБОТАЕТ ТОЛЬКО В БЭКТЕСТЕ - реального частичного закрытия ордера на бирже
# сейчас нет (OrderController закрывает позицию только целиком), в бою эти
# два поля ни на что не влияют.
#
# partialTakeProfitPercent: 0.5 - на полпути к полному тейку закрыть часть
# позиции (см. partialTakeProfitFraction). 0 - частичный тейк выключен.
partialTakeProfitPercent: 0.5

# partialTakeProfitFraction - какую долю ОТ ПЕРВОНАЧАЛЬНОГО объёма закрывать
# на этом уровне; остаток продолжает жить по обычным правилам.
partialTakeProfitFraction: 0.5

# АДАПТИВНЫЙ ТАЙМАУТ.
#
# Сейчас (как и у simplesale) дедлайн - жёсткий обрыв: позиция на +0.4%
# закрывается по рынку точно так же, как позиция на -0.9%, просто потому что
# истекло время. adaptiveTimeoutMinProfitPercent даёт работающей сделке ещё
# немного времени вместо немедленного закрытия.
#
# adaptiveTimeoutMinProfitPercent: 0.3 - если на дедлайне прибыль уже НЕ НИЖЕ
# 0.3% от входа, дедлайн продлевается вместо закрытия. 0 - выключено.
adaptiveTimeoutMinProfitPercent: 0.3

# adaptiveTimeoutExtensionPeriods - на сколько периодов сигнала продлевать
# (однократно на позицию).
adaptiveTimeoutExtensionPeriods: 4



