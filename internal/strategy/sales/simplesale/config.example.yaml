# Имя стратегии
name: SaleSimple
# Id стратегии
idName: salesimple
# Описание стратегии
description: Политика выхода - тейк, стоп и таймаут в единицах волатильности пары
# Включение стратегии
strategyEnable: true

# ПОРОГИ В ЕДИНИЦАХ ВОЛАТИЛЬНОСТИ ПАРЫ.
#
# Волатильность - это типичное движение пары за период (робастная сигма, та же,
# из которой anomaly считает z-score). Она приходит вместе с сигналом.
#
# Почему не фиксированные проценты: 1% для BTC - событие, для мемкоина - шум
# внутри минуты. Одинаковый стоп для обоих либо выбивается шумом, либо не
# защищает. Поэтому тейк и стоп ставятся кратно "нормальному" движению пары.
#
# takeProfitVol: 2.0 означает "берём прибыль на движении в 2 типичных сигмы".
takeProfitVol: 2.0
stopLossVol: 1.5

# Откат в процентах - для сигналов, которые волатильность не считают (base).
takeProfitPercent: 2.0
stopLossPercent: 1.5

# Границы для посчитанных порогов.
# Тейк ниже комиссий бессмыслен; стоп шире разумного - это уже не стоп, а надежда.
minTakeProfitPercent: 0.5
maxTakeProfitPercent: 20.0
minStopLossPercent: 0.5
maxStopLossPercent: 10.0

# Сколько ПЕРИОДОВ СИГНАЛА держим позицию, если не сработали ни тейк, ни стоп.
# Сигнал 15m с maxHoldPeriods: 4 - это час. Смысл: движения, которого мы ждали,
# не случилось, сигнал протух, держать позицию не за что.
# 0 - без ограничения по времени (не рекомендуется).
maxHoldPeriods: 4
