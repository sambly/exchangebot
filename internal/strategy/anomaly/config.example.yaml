# Имя стратегии
name: AnomalyDetector
# Id стратегии
idName: anomaly
# Описание стратегии
description: Обнаружение аномалий цены, объема и трейдов на основе z-score с уровнями

# Включение стратегии
strategyEnable: true
# Включение уведомлений в Telegram
notificationEnable: true

# Писать аномалии в лог (в дополнение к Telegram).
# В лог попадают ВСЕ обнаруженные аномалии - в том числе подавленные cooldown'ом
# и не дотянувшие до minNotifyLevel. Строки помечаются notified=true/false,
# так что потом видно, почему в чате было пусто, а движение - было.
# Формат плоский и грепаемый:
#   anomaly pair=SXTUSDT period=15m level=2 z=7.50 notified=true metrics=[price +6.08%]
logAnomalies: true

# Проверить все доступные пары
allPairs: true

# Минимальный суточный оборот пары в USDT. Пары ниже порога не проверяются.
# Главный фильтр мусора по объёму: у неликвида оборот предыдущего окна близок к
# нулю, поэтому дельта выдаёт +87000% там, где два человека что-то купили.
# Проблема не в величине изменения, а в величине базы — minChange её не лечит.
minDailyVolume: 5000000
# Выбор определенных пар (если allPairs: false)
pairs:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

# Размер окна истории для расчета медианы и разброса (MAD).
# История сеется из БД при старте (таблицы candles_{period}), поэтому окно
# набирается сразу, а не за несколько суток аптайма.
historyWindowSize: 30

# Минимум значений в буфере, до которого z-score не считается вообще.
# Защита на случай, когда в БД мало свечей (feeder работает недавно): на 2-3
# значениях разброс оценивается по шуму и любое рядовое значение улетает в z=10.
minSamples: 20

# Какие метрики отслеживать.
# Каждая включенная метрика - еще один шанс на ложное срабатывание
# (composite = max|z| по всем метрикам), поэтому лишнее лучше не включать.
# volumeBuy сильно коррелирует с volume, но шумит заметно сильнее - выключен.
metrics:
  price: true
  volume: true
  volumeBuy: false
  volumeAsk: false
  trades: false
  tradesBuy: false
  tradesAsk: false

# Порог экономической значимости: минимальное изменение метрики (в сырых %),
# ниже которого срабатывание гасится, каким бы большим ни был z-score.
# Без него стейблкоины дают честные z=5 на движении цены в 0.01%: статистически
# это аномалия, но торговать там нечего.
# Для дельт значение в процентах отношения окон: 100 = "объём изменился вдвое".
minChange:
  price: 1.5
  volume: 100.0
  volumeBuy: 100.0
  volumeAsk: 100.0
  trades: 100.0
  tradesBuy: 100.0
  tradesAsk: 100.0

# Нижняя граница разброса (MAD). Не дает z взорваться до 30-80 на парах, где
# метрика почти всегда стоит на месте и разброс вырождается почти в ноль.
# price - в процентах изменения цены, дельты - в лог-шкале (0.25 ~ ±28%).
minScale:
  price: 0.35
  volume: 0.25
  volumeBuy: 0.25
  volumeAsk: 0.25
  trades: 0.25
  tradesBuy: 0.25
  tradesAsk: 0.25

# Все аномалии одного тика уходят одним дайджестом.
# Сколько строк показывать на период, остальные схлопнутся в "и еще N пар".
digestMaxItems: 10

# Минимальный уровень для попадания в дайджест: 1 - показывать все (⚠️ и выше),
# 2 - только 🔴 и 🚨. Отсеченные уровни все равно учитываются в рыночной метрике.
minNotifyLevel: 1

# Периоды и их настройки
# enabled: false — период не проверяется
# thresholds: три уровня z-score для разной степени аномалии.
#   На коротких периодах проверок в единицу времени больше (пары x метрики
#   каждую минуту), поэтому порог level1 там выше — иначе получите шум.
# historyWindowSize: необязательный override глобального окна для конкретного
#   периода (в историю пишется одно значение за период).
periods:
  1m:
    enabled: false
    thresholds:
      level1: 3.0
      level2: 5.0
      level3: 8.0
  15m:
    enabled: true
    historyWindowSize: 48
    thresholds:
      level1: 4.0
      level2: 6.0
      level3: 8.0
  1h:
    enabled: true
    thresholds:
      level1: 3.5
      level2: 5.0
      level3: 8.0
  4h:
    enabled: true
    historyWindowSize: 20
    thresholds:
      level1: 3.5
      level2: 5.0
      level3: 8.0
  1d:
    enabled: true
    historyWindowSize: 14
    thresholds:
      level1: 3.0
      level2: 5.0
      level3: 8.0

# Рыночная метрика — уведомление, если аномальна большая доля пар.
# Cooldown у нее свой на каждый период.
marketMetric:
  enabled: true
  # Доля аномальных пар для уведомления о рыночной аномалии (%).
  # Знаменатель - число ликвидных (реально проверяемых) пар.
  # 30% недостижимы на практике: даже на сильном движении аномальны единицы
  # процентов пар, поэтому порог опущен до 10.
  anomalyPercentThreshold: 10.0
  # Минимальное количество пар для расчета рыночной метрики
  minPairs: 5
