# Имя стратегии
name: Potential
# Id стратегии
idName: potential
# Описание стратегии
description: Вход по композитному индикатору "Потенциал" (OFI + VPIN + Уровни + Относительная сила, множитель - сжатие волатильности)

# Включение стратегии. false по умолчанию - стратегия совсем новая, не
# проверенная на реальной торговле (только пассивным наблюдением, см.
# ARCHITECTURE.md §10.10), включать сознательно.
#
# Само по себе включение НЕ начинает торговать: исполнитель (executor)
# принимает сигналы только от источников, перечисленных в его sources
# (internal/strategy/executor/config.yaml) - туда "potential" нужно добавить
# отдельно, руками, когда решите, что готовы дать ему реально открывать
# позиции в paperwallet.
strategyEnable: false

# Проверить все пары
allPairs: true
# Выбор определённых пар (если allPairs: false)
pairs:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - DOGEUSDT
  - PEPEUSDT

# Минимальный суточный оборот пары в USDT - тот же фильтр неликвида, что у
# anomaly (см. комментарий там): на мёртвой паре компоненты композита легко
# выглядят внушительно просто потому, что база (объём/сделки) почти нулевая.
minDailyVolume: 5000000

# Какие периоды проверять. entrysetup.GetAllStrengthComponents считает их все
# автоматически (глобальный settings.ChangePeriods), здесь - подмножество,
# которое реально хотим торговать. 15m - единственный период, на котором
# индикаторы были провалидированы диагностическим логом (см. §10.10).
periods:
  - 15m

# Какие компоненты композита голосуют - тот же смысл, что у чекбоксов
# "Потенциала" во фронте (DataStrength.vue). OFI/RelativeStrength голосуют
# только при подтверждённой стороне (Confirmed), VPIN - без confirm-гейта
# (см. §10.10 - стрик там практически никогда не набирается), Levels - всегда.
# Regime - множитель, не голос.
components:
  ofi: true
  vpin: true
  levels: true
  relativeStrength: true
  regime: true

# Пороги |composite| для уровня 1..3 - тот же принцип, что у thresholds
# anomaly, но применяется не к z-score одной метрики, а к усреднённому,
# клипованному composite (см. compositeFromComponents).
#
# Ориентир по логам (см. ARCHITECTURE.md §10.8/§10.10): типичный |z| ГОЛОСУЮЩЕГО
# компонента (после подтверждения) - около 1-3, композит - среднее нескольких
# таких значений. Пороги ниже НЕ откалиброваны бэктестом (отдельная история
# компонентов не хранится, backtest на них не прогнать, см. обсуждение) - это
# отправная точка, требует проверки на реальной работе в paperwallet.
thresholds:
  level1: 1.0
  level2: 2.0
  level3: 3.5

# Минимум присутствующих (голосующих) компонентов - без этого один-единственный
# проголосовавший компонент с большим z решал бы всё сам, а не как один голос
# из нескольких. MinAgree <= MinTotal по смыслу.
minTotal: 2
minAgree: 2

# Сколько тиков (AssetsPrices.Subscribe(), примерно раз в минуту) сторона
# композита должна продержаться подряд, прежде чем стать сигналом - защита от
# секундного дёрга одного из компонентов, тот же принцип, что у
# anomaly.ConfirmChecks.
confirmChecks: 2

# Cooldown на пару+период после публикации сигнала (минуты). Одну позицию на
# пару и так не даст открыть исполнитель (Executor.riskAllows) - это защита
# от повторной публикации в лог/подписчикам, пока композит держится выше
# порога.
cooldownMinutes: 15

# Писать каждый опубликованный сигнал в лог. Единственный канал наблюдения за
# стратегией сейчас (нет Telegram-меню/дайджеста, см. Go-комментарий в
# potential.go) - по умолчанию включено.
logSignals: true
